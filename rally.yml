name: Rally
options:
  bundleIdPrefix: com.mechasoonelians
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rally:
    type: application
    platform: iOS
    sources:
      - Rally
      - path: MechaSoonelians/Capture
        excludes: [CharacterViewer]
      - path: MechaSoonelians/Capture/CharacterViewer
        type: folder
        buildPhase: resources
      - MechaSoonelians/Scan
      - MechaSoonelians/Shared
      - path: TestFixtures/HumanDepth
        buildPhase: resources
        excludes: ["*.py", "*.md", "human-depth-uint16.png"]
    info:
      path: Rally/Info.plist
      properties:
        CFBundleDisplayName: Rally
        NSCameraUsageDescription: The camera scans your house and captures people with depth for player cutouts.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Rally connects to your lobby server so everyone in the room stays in sync.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [rally]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mechasoonelians.Rally
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RallyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RallyTests
      - path: TestFixtures/Character3D/test-rig.glb
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rally
  RallyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RallyUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rally
schemes:
  Rally:
    build:
      targets:
        Rally: all
    test:
      targets: [RallyTests, RallyUITests]
