name: Rally
options:
  bundleIdPrefix: com.mechasoonelians
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rally:
    type: application
    platform: iOS
    sources: [Rally]
    info:
      path: Rally/Info.plist
      properties:
        CFBundleDisplayName: Rally
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Rally connects to your lobby server so everyone in the room stays in sync.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [rally]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mechasoonelians.Rally
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RallyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RallyTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rally
  RallyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RallyUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rally
schemes:
  Rally:
    build:
      targets:
        Rally: all
    test:
      targets: [RallyTests, RallyUITests]
