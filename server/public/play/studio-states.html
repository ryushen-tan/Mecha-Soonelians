<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Game states</title>
<style>
  body { margin: 0; background: #141414; color: #fbfbfb; font: 700 13px "Nunito", system-ui, sans-serif; padding: 18px; }
  h1 { font-size: 16px; margin: 0 0 4px; } p { margin: 0 0 16px; color: #b8bcc8; font-weight: 600; }
  .grid { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 12px; }
  figure { margin: 0; flex: none; } figcaption { margin-bottom: 8px; } a { color: #8ea0ff; }
  iframe { width: 390px; height: 760px; border: 0; border-radius: 28px; background: #e4e7ef; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
</style></head><body>
<h1>Mecha Soonelians · every state of a round</h1>
<p>After GameView.swift + SprayPaintView.swift. Each phone is <code>studio.html?state=…</code>; the real game moves between them on its own. Open one phone alone to play with it.</p>
<div class="grid" id="g"></div>
<script>
const states = [['lobby-host','Lobby · host sets hide / seek time'],['lobby-guest','Lobby · guest waits'],['hide','Hide · find your spot'],['place','Hide · tap where to hide'],['spray','Spray paint (Pick / Hold to spray)'],['eyes','Hide · seekers close their eyes'],['seek','Seek · seeker taps hiders'],['sneaky','Seek · hider stays sneaky'],['results','Results']];
for (const [s, n] of states) { const f = document.createElement('figure'); f.innerHTML = `<figcaption>${n} · <a href="studio.html?state=${s}">open</a></figcaption><iframe src="studio.html?state=${s}&dev=0" loading="lazy" title="${n}"></iframe>`; g.append(f); }
</script></body></html>
