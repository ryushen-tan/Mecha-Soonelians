<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Studio states</title>
<style>
  body { margin: 0; background: #1f2924; color: #f9f7f0; font: 600 13px ui-rounded, "SF Pro Rounded", system-ui, sans-serif; padding: 18px; }
  h1 { font-size: 16px; margin: 0 0 4px; } p { margin: 0 0 16px; color: #b8bfb4; font-weight: 500; }
  .grid { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 12px; }
  figure { margin: 0; flex: none; } figcaption { margin-bottom: 8px; }
  iframe { width: 390px; height: 760px; border: 0; border-radius: 28px; background: #f0f0e7; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
</style></head><body>
<h1>Mecha Studio · every state of the in-game editor</h1>
<p>Each phone is <code>studio.html?state=…</code>; the real editor switches between these with its own buttons. Open one phone alone to play with it.</p>
<div class="grid" id="g"></div>
<script>
const states = [['arrange','Position & pose'],['paint','Paint'],['tools','Tools sheet'],['painttools','Paint tools sheet'],['game','Game controls'],['hider','Hunt · hider (eject)'],['hunter','Hunt · hunter (tag)'],['waiting','Hunter waits for hiders']];
for (const [s, n] of states) { const f = document.createElement('figure'); f.innerHTML = `<figcaption>${n} · <a href="studio.html?state=${s}" style="color:#d4ed5e">open</a></figcaption><iframe src="studio.html?state=${s}&dev=0" loading="lazy" title="${n}"></iframe>`; g.append(f); }
</script></body></html>
