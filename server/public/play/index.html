<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mecha Soonelians</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Nunito:wght@700;800&display=swap">
<link rel="stylesheet" href="variants/lobby.css">
<style>
  /* The web twin of the Rally app's Jelly landing (Rally/JellyScene.swift + JellyExperienceView.swift): black and white figurines
     in game poses, the blue S O O N letters and the logo pour in with SpriteKit-like physics; a PLAY card drops in early and the
     MECCHA SOONELIANS card lands on the pile; the pile blurs after settling while the cards stay sharp. PLAY opens the Jelly cards. */
  :root { --bg: #e4e7ef; --ink: #141414; --paper: #fbfbfb; --blue: #4a63ff; --muted: #6b7080; --field: #f1f2f6; --success: #1f8f5f; --error: #c0392b;
          --font-display: "Outfit", "PingFang SC", system-ui, sans-serif; --font-body: "Nunito", -apple-system, "PingFang SC", system-ui, sans-serif; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  #stage { position: fixed; inset: 0; z-index: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  body.card #stage { pointer-events: none; }
  /* HUD (JellyExperienceView.hud): count top-left, sound top-right, tilt or "DRAG TO PLAY" bottom-left, pour again bottom-right */
  .hud { position: fixed; left: 0; right: 0; z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 10px; pointer-events: none;
         padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  .hud.top { top: env(safe-area-inset-top, 0px); } .hud.bottom { bottom: env(safe-area-inset-bottom, 0px); }
  .hud > * { pointer-events: auto; }
  .hud .ghost { font: 700 14px var(--font-body); color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 16px; padding: 10px 16px; min-height: 44px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; -webkit-tap-highlight-color: transparent; }
  .hud .ghost:active { filter: brightness(.92); }
  .hud .ghost svg { width: 16px; height: 16px; }
  .hud .ghost:focus-visible, #play:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  #count { font: 700 12px var(--font-body); color: var(--muted); }
  #dragHint { font: 700 11px var(--font-body); letter-spacing: .7px; text-transform: uppercase; color: var(--muted); background: rgba(251,251,251,.85); border-radius: 999px; padding: 12px; pointer-events: none; }
  #dragHint[hidden], #btnTilt[hidden] { display: none; }
  body.card .hud { display: none; }
  /* the two physical cards (JellyScene.cardTexture): 16-point corners, 3-point ink stroke, no shadow; DOM, so they stay sharp above the blur */
  .pcard { position: fixed; left: 0; top: 0; transform: translate(-50%, -50%); display: none; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 16px; font-family: var(--font-display); font-weight: 800; line-height: 1; white-space: nowrap; overflow: hidden; }
  .pcard.show { display: block; }
  body.card .pcard { filter: blur(10px); pointer-events: none; }
  #title { z-index: 2; background: var(--paper); color: var(--ink); pointer-events: none; }
  #title small, #title b { position: absolute; left: 5px; right: 5px; text-align: center; display: block; font-weight: 800; }
  #play { z-index: 3; background: var(--blue); color: #fff; cursor: pointer; padding: 0; letter-spacing: 2px; display: none; place-items: center; -webkit-tap-highlight-color: transparent; }
  #play.show { display: grid; }
  #play:hover { background: #3b53f0; }
  #lobby { z-index: 50; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="title" class="pcard" aria-hidden="true"><small>MECCHA</small><b>SOONELIANS</b></div>
<button id="play" class="pcard" type="button" aria-label="Play">▸ PLAY</button>

<div class="hud top">
  <div id="count" aria-hidden="true">0</div>
  <button id="sound" type="button" class="ghost" aria-pressed="false"></button>
</div>
<div class="hud bottom">
  <div><button id="btnTilt" type="button" class="ghost" hidden></button><div id="dragHint">Drag to play</div></div>
  <button id="btnRefill" type="button" class="ghost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Pour again</button>
</div>
<div id="lobby" hidden></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

import { createLobby } from './variants/lobby.js';
import { createSfx } from './variants/sfx.js';

// ================================================================ scene (orthographic, x–y plane = the screen; 1 unit = 1 m, 7.2 m tall)
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene(); scene.background = new THREE.Color(0xe4e7ef);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50); camera.position.set(0, 0, 10);
const VIEW_H = 7.2; let VIEW_W = 4;
const pxPerM = () => stage.clientHeight / VIEW_H;
// blur = the scene rendered small, blurred, upscaled: level 1 ≈ the app's 4-point CIGaussianBlur after settling, level 2 ≈ the 10-point blur under a card
const BLUR_RES = 0.35;
const composer = new EffectComposer(renderer); composer.setPixelRatio(1);

for (const b of blurs) composer.addPass(b);

}
let lastW = 0;
function onLayout() { const w = stage.clientWidth; fitCamera(); layoutCards(); placeCards(); if (lastW && Math.abs(w - lastW) > 60 && pieces.length) pour(); lastW = w; }   // the app re-pours when its size changes
fitCamera(); lastW = stage.clientWidth; addEventListener('resize', onLayout);

// ================================================================ textures: the eight figurine masks with an outline (JellyScene.figureTexture), the blue letters and logo (blueTexture)
const INK = '#141414', PAPER = '#fbfbfb', BLUE = '#4a63ff';
function outlined(img, fill, stroke) {

  for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; g.drawImage(img, p + Math.cos(a) * p, p + Math.sin(a) * p); }
  g.globalCompositeOperation = 'source-in'; g.fillStyle = stroke; g.fillRect(0, 0, c.width, c.height); g.globalCompositeOperation = 'source-over';
  const f = document.createElement('canvas'); f.width = img.width; f.height = img.height; const gf = f.getContext('2d');
  gf.drawImage(img, 0, 0); gf.globalCompositeOperation = 'source-in'; gf.fillStyle = fill; gf.fillRect(0, 0, f.width, f.height);

const tex = (cv) => { const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
const figureTextures = [];   // { tex, ratio }
const loadSprite = (i, tries = 3) => new Promise((res) => {
  const go = (n) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => (n > 1 ? setTimeout(() => go(n - 1), 300) : res(null)); im.src = `sprites/pose-${i + 1}.png${n < tries ? `?retry=${n}` : ''}`; };
  go(tries);
});
const spritesReady = Promise.all(Array.from({ length: 8 }, (_, i) => loadSprite(i))).then(list => {
  for (const im of list) if (im) for (const white of [false, true]) { const c = outlined(im, white ? PAPER : INK, white ? INK : PAPER); figureTextures.push({ tex: tex(c), ratio: c.width / c.height }); }

/** JellyScene.blueTexture, 1:1 — a 120-pt square: ink shadow stroke (22) under a blue stroke (18), round caps. Rendered at 4× for crispness. */
function blueTexture(letter) {
  const S = 4, c = document.createElement('canvas'); c.width = c.height = 120 * S; const g = c.getContext('2d'); g.scale(S, S);
  const path = new Path2D();

  else if (letter === 'N') { path.moveTo(26, 98); path.lineTo(26, 22); path.lineTo(94, 98); path.lineTo(94, 22); }
  else if (letter === 'S') { path.moveTo(87, 27); path.bezierCurveTo(24, 0, 10, 53, 53, 60); path.bezierCurveTo(124, 72, 90, 122, 30, 94); }
  else { path.moveTo(64, 17); path.lineTo(103, 57); path.moveTo(17, 94); path.lineTo(92, 94); path.lineTo(92, 72); path.moveTo(42, 55); path.lineTo(46, 59); }

  g.shadowOffsetX = 1 * S; g.shadowOffsetY = 4 * S; g.shadowBlur = 3 * S; g.shadowColor = 'rgba(20,20,20,.3)';

const blueTextures = { S: blueTexture('S'), O: blueTexture('O'), N: blueTexture('N'), logo: blueTexture(null) };
const spriteMesh = (t, w, h) => new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t, transparent: true, alphaTest: 0.2 }));

// ================================================================ physics, matching JellyScene: circle bodies 0.44 of the piece, restitution 0.6 / friction 0.4, mass ∝ size², linear damping 0.12,
// angular damping 0.6, walls = an edge loop two pieces taller than the screen, cards = upright boxes (restitution 0.24, friction 0.6, mass 1.2, damping 0.5) on a floor 110 pt up.
const G = 9.4, MAX_DT = 1 / 50, SLOP = 0.6, PASSES = 8;
const pieces = [];                  // { group|el, w, h, r|box, mass, e, f, damp, x, y, vx, vy, angle, av, asleep, still, moved }
const gravity = { x: 0, y: -G };
let count = 0, target = 0, nextSpawn = 0, finishTime = 0, filled = false, pileBlur = false, cardOpen = false, dragging = null, lastInput = 0;
const rand = (a, b) => a + Math.random() * (b - a), clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const pieceSize = () => Math.min(VIEW_H / 9, VIEW_W / 4.4);
const cardFloorY = () => -VIEW_H / 2 + 110 / pxPerM();
const speedOf = (p) => Math.hypot(p.vx, p.vy);
function spawnPiece(index) {
  const letters = { 6: 'S', 11: 'O', 16: 'O', 21: 'N' }; let t, ratio;
  if (letters[index]) { t = blueTextures[letters[index]]; ratio = 1; } else if (index === 3) { t = blueTextures.logo; ratio = 1; } else { const f = figureTextures[Math.floor(Math.random() * figureTextures.length)]; t = f.tex; ratio = f.ratio; }
  const extent = pieceSize() * rand(0.85, 1.1), w = ratio > 1 ? extent : extent * ratio, h = ratio > 1 ? extent / ratio : extent;
  const p = { group: spriteMesh(t, w, h), w, h, r: extent * 0.44, mass: extent * extent, e: 0.6, f: 0.4, damp: 0.12, angDamp: 0.6,
    x: rand(-VIEW_W / 2 + extent / 2, VIEW_W / 2 - extent / 2), y: VIEW_H / 2 + extent, vx: rand(-0.26, 0.26), vy: -0.47, angle: rand(-0.8, 0.8), av: rand(-1.5, 1.5), asleep: false, still: 0, moved: 0, figure: true };

}
function refill() {
  stopTilt(); for (const q of pieces) if (q.group) { scene.remove(q.group); q.group.geometry.dispose(); } pieces.length = 0;
  for (const c of [playCard, titleCard]) { c.el.classList.remove('show'); c.live = false; }
  count = 0; nextSpawn = 0; finishTime = 0; filled = false; dragging = null; setPileBlur(false);
  const ps = pieceSize(); target = Math.min(150, Math.max(24, Math.round(VIEW_W * VIEW_H * 0.48 / (ps * ps * 0.72))));
  document.getElementById('count').textContent = '0';
}
function pour() { sfx.stopBgm(); refill(); spritesReady.then(() => { nextSpawn = performance.now() / 1000 + 0.15; }); }
// ---- bodies
function integrate(b, dt) {

// ---------------- the two physical cards (JellyScene.addCard): PLAY after the 5th piece, the title 0.3 s after the pour; DOM, sized like the app
const domCard = (el) => ({ el, box: { hw: 1, hh: 0.4 }, w: 2, h: 0.8, r: 0.4, mass: 1.2, e: 0.24, f: 0.6, damp: 0.5, live: false, asleep: false, still: 0, moved: 0 });
const playCard = domCard(document.getElementById('play')), titleCard = domCard(document.getElementById('title'));
function layoutCards() {

  titleCard.el.querySelector('b').style.cssText = `font-size:${tw * 0.105}px; top:${th * 0.38}px`;
  for (const [c, w, h] of [[playCard, pw, ph], [titleCard, tw, th]]) { c.w = w / m; c.h = h / m; c.box = { hw: c.w / 2, hh: c.h / 2 }; c.r = Math.max(c.w, c.h) / 2; }

// ================================================================ blur, sound, HUD

const soundBtn = document.getElementById('sound');
const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = { note: svg('<path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>'), speakerSlash: svg('<path d="M4 10v4h3l4 4V6L7 10zM15 9l5 6M20 9l-5 6"/>'), tilt: svg('<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M3 9a5 5 0 0 0 0 6M21 9a5 5 0 0 1 0 6"/>') };
function paintSound() { soundBtn.innerHTML = (sfx.muted ? ICON.speakerSlash : ICON.note) + (sfx.muted ? 'Sound off' : 'Sound on'); soundBtn.setAttribute('aria-pressed', String(!sfx.muted)); }
soundBtn.addEventListener('click', () => { sfx.toggleMute(); paintSound(); }); soundBtn.addEventListener('sfxchange', paintSound); paintSound();

// ================================================================ input: tilt (Core Motion in the app), drag a figure to throw it, drag the background to lean gravity
const tiltBtn = document.getElementById('btnTilt'), dragHint = document.getElementById('dragHint');
const supportsTilt = typeof DeviceMotionEvent !== 'undefined' && navigator.maxTouchPoints > 0;
tiltBtn.hidden = !supportsTilt; dragHint.hidden = supportsTilt;
let tiltOn = false, motionSign = 0;
function paintTilt() { tiltBtn.innerHTML = ICON.tilt + (tiltOn ? 'Tilt on' : 'Enable tilt'); tiltBtn.setAttribute('aria-pressed', String(tiltOn)); }
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  const v = new THREE.Vector3(-a.x, -a.y, -a.z);
  if (motionSign === 0) { if (v.length() > 7) motionSign = (Math.abs(a.y) > Math.abs(a.z) ? -Math.sign(a.y) : -Math.sign(a.z)) || 1; else return; }
  v.multiplyScalar(motionSign); if (v.length() < 2) return; v.normalize();
  gravity.x = v.x * G; gravity.y = Math.min(-0.8, v.y * G);   // JellyScene: gravity.x * 9.4, min(-0.8, gravity.y * 9.4)
}
function stopTilt() { removeEventListener('devicemotion', onMotion); tiltOn = false; gravity.x = 0; gravity.y = -G; paintTilt(); }
tiltBtn.addEventListener('click', async () => {
  if (tiltOn) return stopTilt();
  try { if (typeof DeviceMotionEvent.requestPermission === 'function' && (await DeviceMotionEvent.requestPermission()) !== 'granted') return; } catch { return; }
  addEventListener('devicemotion', onMotion); tiltOn = true; paintTilt(); setPileBlur(false); wakeAll();
});
paintTilt();
const wakeAll = () => { for (const p of pieces) wake(p); };
const toWorld = (ev) => { const r = renderer.domElement.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * VIEW_W - VIEW_W / 2, y: VIEW_H / 2 - (ev.clientY - r.top) / r.height * VIEW_H }; };
function figureAt(x, y) { for (let i = pieces.length - 1; i >= 0; i--) { const p = pieces[i]; if (p.figure && (x - p.x) ** 2 + (y - p.y) ** 2 <= p.r * p.r) return p; } return null; }
let bg = null, prev = null, prevT = 0, throwV = { x: 0, y: 0 };
stage.addEventListener('pointerdown', (ev) => {
  if (cardOpen) return; stage.setPointerCapture(ev.pointerId); const w = toWorld(ev);
  setPileBlur(false); finishTime = 0; wakeAll();
  const p = figureAt(w.x, w.y);
  if (p) { dragging = { p, x: w.x, y: w.y }; wake(p); } else bg = { x: ev.clientX };
  prev = { x: ev.clientX, y: ev.clientY, wx: w.x, wy: w.y }; prevT = ev.timeStamp; throwV = { x: 0, y: 0 };
});
stage.addEventListener('pointermove', (ev) => {
  if (!prev) return; if (ev.pointerType === 'mouse' && !(ev.buttons & 1)) return release();
  const w = toWorld(ev), dt = Math.max((ev.timeStamp - prevT) / 1000, 1 / 120), cap = 1000 / pxPerM();
  throwV = { x: clamp((w.x - prev.wx) / dt, -cap, cap), y: clamp((w.y - prev.wy) / dt, -cap, cap) };
  if (dragging) { const ps = pieceSize(); dragging.x = clamp(w.x, -VIEW_W / 2 + ps / 2, VIEW_W / 2 - ps / 2); dragging.y = clamp(w.y, -VIEW_H / 2 + ps / 2, VIEW_H / 2 - ps / 2); }
  else if (bg && !tiltOn) { gravity.x = clamp((ev.clientX - prev.x) * 0.5, -G, G); gravity.y = -G; }   // JellyScene.touchesMoved
  prev = { x: ev.clientX, y: ev.clientY, wx: w.x, wy: w.y }; prevT = ev.timeStamp;
});
function release() {
  if (dragging) { dragging.p.vx = throwV.x; dragging.p.vy = throwV.y; dragging = null; }
  bg = null; prev = null; if (!tiltOn) { gravity.x = 0; gravity.y = -G; }
  if (count === target && target) finishTime = performance.now() / 1000;   // the same settling blur after an interaction as after the pour
}
stage.addEventListener('pointerup', release); stage.addEventListener('pointercancel', release); stage.addEventListener('lostpointercapture', release); addEventListener('blur', release);
document.getElementById('btnRefill').addEventListener('click', pour);

// ================================================================ frame (JellyScene.update): spawn on a 86–141 ms cadence, PLAY after 5, title 0.3 s after the pour, blur 4 s after settling
let last = performance.now();
function frame(nowMs) {
  requestAnimationFrame(frame);
  const now = nowMs / 1000, dtReal = Math.min(0.25, (nowMs - last) / 1000); last = nowMs;
  if (nextSpawn && count < target && now >= nextSpawn && figureTextures.length) {
    spawnPiece(count); count++; document.getElementById('count').textContent = String(count);
    nextSpawn = now + rand(0.086, 0.141);
    if (count === 5) addCard(playCard);
    if (count === target) { finishTime = now; filled = true; sfx.startBgm(); }
  }
  if (count === target && target && !titleCard.live && now > finishTime + 0.3) addCard(titleCard);
  if (finishTime > 0 && now > finishTime + 4 && !dragging && !tiltOn && !pileBlur) setPileBlur(true);
  const steps = Math.min(4, Math.ceil(dtReal / MAX_DT)), dt = dtReal / steps;
  for (let s = 0; s < steps; s++) physics(dt);
  syncMeshes(); placeCards();
  if (blurLevel) composer.render(); else renderer.render(scene, camera);
}
requestAnimationFrame(frame);
pour();

// ================================================================ PLAY → the Jelly cards (HomeView / LobbyView); the scene blurs 10 pt under a card and the HUD hides, like the app
const lobby = createLobby({ overlay: document.getElementById('lobby'), sfx, onOpen: () => setCardOpen(true), onClose: () => setCardOpen(false) });
document.getElementById('play').addEventListener('click', () => lobby.open('code'));
if (lobby.session) lobby.open();
window.__dbg = { renderer, scene, camera, pieces, sfx, lobby, state: () => ({ count, target, filled, pileBlur, cardOpen, blurLevel, asleep: pieces.filter(p => p.asleep).length, dragging: !!dragging, play: playCard.live && [+playCard.x.toFixed(2), +playCard.y.toFixed(2)], title: titleCard.live && [+titleCard.x.toFixed(2), +titleCard.y.toFixed(2)] }) };
</script>
</body>
