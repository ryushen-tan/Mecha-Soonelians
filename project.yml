name: MechaSoonelians
options:
  bundleIdPrefix: com.ryushentan
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MechaSoonelians:
    type: application
    platform: iOS
    # Rally's design system is shared with Kai's lobby app, not copied.
    sources: [MechaSoonelians, Rally/Design.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryushentan.MechaSoonelians
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: MechaSoonelians/Info.plist
      properties:
        CFBundleDisplayName: Mecha Soonelians
        NSCameraUsageDescription: The camera is used to scan the house.
        NSLocalNetworkUsageDescription: Finds and connects to other players' phones on your Wi-Fi.
        NSBonjourServices: [_mecha-soon._tcp, _mecha-soon._udp]
        UIRequiredDeviceCapabilities: [arkit]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
