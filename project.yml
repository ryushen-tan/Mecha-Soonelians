name: MechaSoonelians
options:
  bundleIdPrefix: com.ryushentan
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MechaSoonelians:
    type: application
    platform: iOS
    sources:
      - path: MechaSoonelians
        excludes: [Capture/CharacterViewer]
      - path: MechaSoonelians/Capture/CharacterViewer
        type: folder
        buildPhase: resources
      - Rally/Design.swift
      - path: TestFixtures/LiDAR/room/rgb.jpg
        buildPhase: resources
      - path: TestFixtures/LiDAR/room/depth-preview.png
        buildPhase: resources
      - path: TestFixtures/LiDAR/room/LICENSE.txt
        buildPhase: resources
      - path: TestFixtures/HumanDepth
        buildPhase: resources
        excludes: ["*.py", "*.md", "human-depth-uint16.png"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryushentan.MechaSoonelians
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: MechaSoonelians/Info.plist
      properties:
        CFBundleDisplayName: Mecha Soonelians
        NSCameraUsageDescription: The camera is used to scan the house and capture people with depth for player cutouts.
        NSLocalNetworkUsageDescription: Connect to your Mac to generate 3D characters with Tripo.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIRequiredDeviceCapabilities: [arkit]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
