name: MechaSoonelians
options:
  bundleIdPrefix: com.ryushentan
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MechaSoonelians:
    type: application
    platform: iOS
    sources:
      - path: MechaSoonelians
        excludes: [Capture/CharacterViewer, Lobby/JellyAssets, Lobby/ProfilePhotos]
      - path: MechaSoonelians/Capture/CharacterViewer
        type: folder
        buildPhase: resources
      - path: MechaSoonelians/Lobby/JellyAssets
        type: folder
        buildPhase: resources
      - path: MechaSoonelians/Lobby/ProfilePhotos
        type: folder
        buildPhase: resources
      - path: House
        type: folder
        buildPhase: resources
      - path: TestFixtures/LiDAR/room/rgb.jpg
        buildPhase: resources
      - path: TestFixtures/LiDAR/room/depth-preview.png
        buildPhase: resources
      - path: TestFixtures/LiDAR/room/LICENSE.txt
        buildPhase: resources
      - path: TestFixtures/HumanDepth
        buildPhase: resources
        excludes: ["*.py", "*.md", "human-depth-uint16.png"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryushentan.MechaSoonelians
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2026102501"
    info:
      path: MechaSoonelians/Info.plist
      properties:
        CFBundleDisplayName: MecchaSoonelians
        UIAppFonts: ["JellyAssets/fonts/Outfit[wght].ttf", "JellyAssets/fonts/Nunito[wght].ttf"]
        NSMotionUsageDescription: Tilt your phone to move the figurines on the landing screen.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [rally]
        NSCameraUsageDescription: The camera is used to scan the house and capture people with depth for player cutouts.
        NSLocalNetworkUsageDescription: Connects to your lobby server so everyone in the room stays in sync.
        NSBonjourServices: [_mecha-soon._tcp, _mecha-soon._udp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIRequiredDeviceCapabilities: [arkit]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  MechaSooneliansTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MechaSooneliansTests
      - path: TestFixtures/Character3D/test-rig.glb
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MechaSoonelians
  MechaSooneliansUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MechaSooneliansUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MechaSoonelians
schemes:
  MechaSoonelians:
    build:
      targets:
        MechaSoonelians: all
    test:
      targets: [MechaSooneliansTests, MechaSooneliansUITests]
